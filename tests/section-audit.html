<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Section visual audit</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
      iframe { display: block; }
    </style>
  </head>
  <body>
    <iframe title="Living Index visual audit"></iframe>
    <script>
      const frame = document.querySelector("iframe");
      const params = new URLSearchParams(location.search);
      const section = params.get("section") || "top";
      const offset = Number(params.get("offset") || 0);
      const auditWidth = Number(params.get("width") || 0);
      if (auditWidth > 0) frame.style.width = `${auditWidth}px`;
      frame.src = `../index.html?visual-audit=${encodeURIComponent(section)}`;
      frame.addEventListener("load", () => {
        const target = frame.contentDocument.getElementById(section);
        if (!target) return;
        frame.contentDocument.documentElement.style.scrollBehavior = "auto";
        target.scrollIntoView({ behavior: "auto", block: "start" });
        frame.contentWindow.scrollBy({ top: offset, behavior: "auto" });
        if (params.has("metrics")) {
          const selectors = [".hero", ".hero__portrait-wrap", ".hero__portrait-wrap picture", ".hero__portrait"];
          const metrics = Object.fromEntries(selectors.map((selector) => {
            const node = frame.contentDocument.querySelector(selector);
            if (!node) return [selector, null];
            const rect = node.getBoundingClientRect();
            const style = frame.contentWindow.getComputedStyle(node);
            return [selector, {
              x: Math.round(rect.x), y: Math.round(rect.y), width: Math.round(rect.width), height: Math.round(rect.height),
              display: style.display, maxHeight: style.maxHeight, objectFit: style.objectFit,
            }];
          }));
          metrics.viewport = {
            outerWidth: frame.contentWindow.outerWidth,
            innerWidth: frame.contentWindow.innerWidth,
            clientWidth: frame.contentDocument.documentElement.clientWidth,
            scrollWidth: frame.contentDocument.documentElement.scrollWidth,
          };
          document.body.dataset.metrics = JSON.stringify(metrics);
        }
      });
    </script>
  </body>
</html>
